<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的表情</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff7e8,#20232a);--text:light-dark(#3d342b,#fff);--soft:light-dark(#fff,#2b3038);--accent:light-dark(#ff9b73,#ffb08e)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}body{overflow:hidden}
#app{width:100%;height:100%;min-height:100vh;background-color:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;padding:20px}
.hint{font-size:clamp(16px,2vw,24px);opacity:.72;margin-bottom:10px}.face-wrap{width:min(78vw,78vh,720px);height:min(78vw,78vh,720px);display:grid;place-items:center;position:relative}
.face{width:100%;height:100%;border-radius:50%;background:#ffd29a;position:relative;box-shadow:inset -18px -24px 0 rgba(190,105,55,.08),0 18px 45px rgba(80,55,30,.15);transition:transform .16s ease,background .25s ease}
.face:after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 5px rgba(150,80,45,.08)}
.eye{position:absolute;width:13%;height:16%;top:31%;background:#3a2a25;border-radius:50%;transition:.2s;box-shadow:inset 0 -12px 0 rgba(255,255,255,.12)}.eye:after{content:"";position:absolute;width:24%;height:24%;left:18%;top:14%;background:#fff;border-radius:50%}.eye.left{left:24%}.eye.right{right:24%}.brow{position:absolute;width:17%;height:4%;top:25%;background:#5b382d;border-radius:999px;transition:.2s}.brow.left{left:22%;transform:rotate(-4deg)}.brow.right{right:22%;transform:rotate(4deg)}.nose{position:absolute;left:50%;top:43%;width:7%;height:10%;transform:translateX(-50%);border-right:5px solid #c47e55;border-bottom:5px solid #c47e55;border-radius:0 0 55% 0}.mouth{position:absolute;left:50%;top:58%;width:28%;height:14%;transform:translateX(-50%);border-bottom:11px solid #7b3f35;border-radius:0 0 50% 50%;transition:.2s}
.blush{position:absolute;width:14%;height:7%;top:52%;border-radius:50%;background:#f58d83;opacity:.35}.blush.left{left:16%}.blush.right{right:16%}.tear{position:absolute;width:7%;height:14%;top:45%;background:#62bff5;border-radius:50% 50% 55% 55%;opacity:0;transform:scale(.5);transition:.25s}.tear.left{left:28%}.tear.right{right:28%}.tear:after{content:"";position:absolute;bottom:-12%;left:30%;width:40%;height:22%;background:#62bff5;border-radius:50%}
.face.happy .mouth{top:55%;width:34%;height:21%;border-bottom-width:15px}.face.happy .eye{height:10%;top:34%;border-radius:50% 50% 20% 20%}.face.happy .brow{top:26%;height:3%;transform:rotate(0)}.face.happy .nose{top:43%}.face.sad .mouth{top:65%;width:28%;height:16%;border-bottom:0;border-top:12px solid #7b3f35;border-radius:50% 50% 0 0}.face.sad .eye{top:34%;height:15%}.face.sad .brow{top:26%;transform:rotate(14deg)}.face.sad .brow.right{transform:rotate(-14deg)}.face.sad .tear{opacity:1;transform:scale(1);animation:cry 1s ease-in-out infinite alternate}.face.tired .eye{top:36%;height:5%;border-radius:20px}.face.tired .brow{top:29%;height:3%}.face.tired .mouth{top:61%;width:24%;height:5%;border-bottom-width:8px}.face.angry{background:#f06b62}.face.angry .blush{opacity:.75;background:#d83f38}.face.angry .eye{top:33%;height:11%;border-radius:50%;transform:rotate(28deg)}.face.angry .eye.right{transform:rotate(-28deg)}.face.angry .brow{top:25%;height:5%}.face.angry .brow.left{transform:rotate(18deg)}.face.angry .brow.right{transform:rotate(-18deg)}.face.angry .mouth{top:63%;width:30%;height:5%;border-bottom-width:10px;border-radius:30%;transform:translateX(-50%) rotate(0)}
@keyframes cry{from{transform:scale(1) translateY(0)}to{transform:scale(1.08) translateY(8px)}}
.emotion{min-height:1.3em;margin-top:12px;font-size:clamp(32px,5vw,58px);font-weight:800;letter-spacing:.12em}.sub{font-size:14px;opacity:.5;margin-top:4px}
@media(max-height:600px){.face-wrap{width:min(65vh,65vw);height:min(65vh,65vw)}.hint{margin-bottom:0}.emotion{margin-top:3px}}
</style>
</head>
<body>
<div id="app" aria-label="点击切换孩子的表情">
  <div class="hint">点击一下，看看我的心情！</div>
  <div class="face-wrap"><div id="face" class="face happy"><i class="eye left"></i><i class="eye right"></i><i class="brow left"></i><i class="brow right"></i><i class="nose"></i><i class="blush left"></i><i class="blush right"></i><i class="tear left"></i><i class="tear right"></i><i class="mouth"></i></div></div>
  <div id="emotion" class="emotion">开心</div>
  <div class="sub">每次点击都会随机变换表情</div>
</div>
<script>
const states=[['happy','开心'],['sad','伤心'],['tired','疲倦'],['angry','生气']];
const face=document.getElementById('face'), emotion=document.getElementById('emotion'), app=document.getElementById('app');
let last=-1;
function change(){let n;do{n=Math.floor(Math.random()*states.length)}while(n===last);last=n;const [cls,label]=states[n];face.className='face '+cls;emotion.textContent=label;face.style.transform='scale(.96)';setTimeout(()=>face.style.transform='scale(1)',120)}
app.addEventListener('click',change);app.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();change()}});
</script>
</body></html>
